<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="미미 프레쉬">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>미미 프레쉬</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div class="top-in">
    <div>
      <div class="brand"><img src="logo.png" alt="">미미 프레쉬</div>
      <h1 id="title">거래처</h1>
    </div>
    <div id="top-act"></div>
  </div>
</header>

<main>
  <button id="syncbar" data-act="cloud-tap" hidden></button>
  <section id="tab-clients" class="tab"></section>
  <section id="tab-sales" class="tab" hidden>
    <div id="sales-top"></div>
    <div id="sales-sum"></div>
    <div id="map-wrap" hidden><div id="map"></div><p id="map-msg" class="hint"></p></div>
    <div id="sales-list"></div>
  </section>
  <section id="tab-docs" class="tab" hidden></section>
  <section id="tab-settings" class="tab" hidden></section>
</main>

<nav id="nav" aria-label="메뉴">
  <button data-tab="clients" class="on"></button>
  <button data-tab="sales"></button>
  <button data-tab="docs"></button>
  <button data-tab="settings"></button>
</nav>

<div id="login" hidden>
  <form class="login-in" id="login-form" autocomplete="on">
    <img src="logo.png" alt="미미 프레쉬 로고">
    <h2>미미 프레쉬</h2>
    <p>한 번 로그인하면 계속 유지되고,<br>거래처·견적서·설정이 따라옵니다.</p>
    <input id="l-email" type="email" placeholder="이메일" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    <input id="l-pass" type="password" placeholder="비밀번호" autocomplete="current-password" required>
    <button class="btn pri wide big" type="submit" data-act="login">로그인</button>
    <button class="btn soft wide" type="button" data-act="signup">처음이면 계정 만들기</button>
    <button class="btn plain wide" type="button" data-act="login-skip">로그인 없이 시작</button>
    <p class="hint" id="login-msg" role="alert"></p>
  </form>
</div>
<div id="sheet" hidden></div>
<div id="toast" role="status" hidden></div>
<input id="import-file" type="file" accept="application/json,.json" hidden>
<input id="tpl-file" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>

<script src="js/config.js"></script>
<script src="js/route.js"></script>
<script src="js/store.js"></script>
<script src="js/kakao.js"></script>
<script src="js/vendor/supabase.js"></script>
<script src="js/cloud.js"></script>
<script src="js/vendor/fflate.js"></script>
<script src="js/quote.js"></script>
<script src="js/app.js"></script>
</body>
</html>
